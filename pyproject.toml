[tool.poetry]
name = "project2-zhmurov-nikolai-m25-555"
version = "0.1.0"
description = ""
authors = ["Nikolai Zhmurov <nikolayzhmurov88@gmail.com>"]
#readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.9"
prompt = "^0.4.1"
prettytable = "^3.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
ruff = "^0.14.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
database = "src.primitive_db.engine:run"

[tool.ruff]
line-length = 175
target-version = "py311"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []